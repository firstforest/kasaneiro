[tools]
rust = "1.96.0"

[tasks.run]
description = "アプリを起動する"
run = "cargo run"

[tasks."run:capture"]
description = "解析用キャプチャ付きで起動する(target/capture/<日時>/ にログ・ストローク・終了時の画面と全状態)"
run = "cargo run -- --capture"

[tasks."replay:capture"]
description = "いちばん新しいキャプチャを headless で再生して replay.png を書く(別のものは KASANEIRO_CAPTURE=<dir>)"
run = "cargo test --test capture_replay -- --ignored --nocapture"

[tasks.test]
description = "全テスト(e2e は GPU 必須)"
run = "cargo test --workspace"

[tasks."test:quick"]
description = "GPU 不要のテストだけ(純関数クレート + シェーダー検証 + SimParams レイアウト)"
run = [
  "cargo test -p km -p pigment -p paint-core",
  "cargo test --test shader_compile --test sim_params_layout",
]

[tasks."test:e2e"]
description = "e2e テスト(GPU 必須。失敗時は target/tmp/e2e/*.png を確認)"
run = "cargo test --test e2e_watercolor --test e2e_ui --test e2e_video"

[tasks.bench]
description = "512/1024/2048 のフレーム時間を計測(GPU 必須)"
run = "cargo test --test perf_bench -- --ignored --nocapture"

[tasks.lint]
description = "clippy"
run = "cargo clippy --workspace"

[tasks.release]
description = "配布用リリースビルド(WGSL と既定 JSON を exe に埋め込む)"
run = "cargo build --release --features embed-assets"
